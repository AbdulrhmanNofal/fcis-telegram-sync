name: FCIS Telegram Sync

on:
  workflow_dispatch:
    inputs:
      approved_items:
        description: 'JSON array of approved items to sync'
        required: false
        default: ''

jobs:
  sync:
    name: Run Telegram Ingestion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Telegram Sync
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_COMMUNITY: ${{ secrets.TG_COMMUNITY }}
          FCIS_API_BASE: ${{ secrets.FCIS_API_BASE }}
          FCIS_ADMIN_EMAIL: ${{ secrets.FCIS_ADMIN_EMAIL }}
          FCIS_ADMIN_PASSWORD: ${{ secrets.FCIS_ADMIN_PASSWORD }}
          ADMIN_PERSONAL_TARGET: ${{ secrets.ADMIN_PERSONAL_TARGET }}
          APPROVED_ITEMS: ${{ inputs.approved_items }}
        run: |
          if [ -n "$APPROVED_ITEMS" ]; then
            echo "Running sync for approved items..."
            python main.py --sync-items "$APPROVED_ITEMS"
          else
            echo "Running standard full sync..."
            python main.py
          fi
